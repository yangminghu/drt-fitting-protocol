name: CI

# push 到 main / 提 PR 时校验；推 v* tag 时校验 + 自动发布 Release（附件自动带上 zip）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_DIR: drt-fitting-protocol
  ZIP_PATH: dist/drt-fitting-protocol.zip

jobs:
  validate:
    name: 校验技能包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install --quiet --disable-pip-version-check numpy openpyxl

      - name: 换行检查（必须全部 LF）
        run: |
          set -e
          if git ls-files --eol | grep -qE 'w/(crlf|mixed)'; then
            echo "::error::以下文件不是 LF 换行："
            git ls-files --eol | grep -E 'w/(crlf|mixed)'
            exit 1
          fi
          echo "全部文件均为 LF"

      - name: 确定性打包（跑两次必须逐字节相同）
        run: |
          set -e
          python tools/build_zip.py
          cp "$ZIP_PATH" /tmp/first.zip
          python tools/build_zip.py
          a=$(sha256sum /tmp/first.zip | cut -d' ' -f1)
          b=$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)
          echo "第一次 $a"
          echo "第二次 $b"
          if [ "$a" != "$b" ]; then echo "::error::打包不可复现"; exit 1; fi

      - name: 包自检（结构 / 版本串 / 附录D 逐字节 / 引用完整性 / 编码）
        run: python "$PKG_DIR/scripts/自检_协议包.py"

      - name: 工具箱回归（全合成数据，不依赖任何实测数据）
        run: python "$PKG_DIR/scripts/自检_工具箱回归.py"

      - name: 隐私体检
        env:
          # 具体数据标识不写进仓库，用仓库变量传入（留空则只跑通用规则）
          PRIVACY_DENY: ${{ vars.PRIVACY_DENY }}
        run: python tools/scan_privacy.py "$ZIP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: drt-fitting-protocol-zip
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  release:
    name: 发布 / 更新 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 打包（与校验作业同一脚本，字节可复现）
        run: python tools/build_zip.py

      - name: 创建或更新 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          TITLE="DRT 拟合规范 ${TAG}"
          NOTES="RELEASE_NOTES-${TAG}.md"
          [ -f "$NOTES" ] || NOTES="RELEASE_NOTES.md"
          echo "tag=$TAG  标题=$TITLE  说明文件=$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" "$ZIP_PATH" --clobber
          # --clobber 只覆盖同名附件，这里清掉改名后残留的旧附件
          want=$(basename "$ZIP_PATH")
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            if [ -n "$name" ] && [ "$name" != "$want" ]; then
              echo "删除过期附件: $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done

      - name: 结果核对
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${GITHUB_REF_NAME}" --json tagName,name,assets
