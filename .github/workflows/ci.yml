name: CI

# 推 main / 提 PR：校验 + 打包 + 隐私体检，并上传产物。
# 推 v* tag   ：复用上一步的产物，自动创建或更新 Release 并挂附件。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  PKG_DIR: drt-fitting-protocol
  ZIP_PATH: dist/drt-fitting-protocol.zip
  ARTIFACT: drt-fitting-protocol-zip

jobs:
  validate:
    name: 校验并打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（包内脚本只需要 numpy + openpyxl）
        run: python -m pip install --quiet --disable-pip-version-check numpy openpyxl

      - name: 包自检 + 工具箱回归
        run: |
          python "$PKG_DIR/scripts/自检_协议包.py"
          python "$PKG_DIR/scripts/自检_工具箱回归.py"

      - name: 打包（两遍比对可复现性）+ 隐私体检
        env:
          # 具体数据标识绝不写进仓库；用 Secret 传入（Variable 不加密不掩码，不能用）
          PRIVACY_DENY: ${{ secrets.PRIVACY_DENY }}
        run: |
          set -e
          python tools/build_zip.py
          cp "$ZIP_PATH" /tmp/first.zip
          python tools/build_zip.py
          a=$(sha256sum /tmp/first.zip | cut -d' ' -f1)
          b=$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)
          echo "zip sha256 = $b"
          if [ "$a" != "$b" ]; then echo "::error::打包不可复现"; exit 1; fi
          python tools/scan_privacy.py "$ZIP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # 只用于取 RELEASE_NOTES.md

      - uses: actions/download-artifact@v4  # 直接复用校验过的产物，不重新打包
        with:
          name: ${{ env.ARTIFACT }}
          path: dist

      - name: 创建/更新 Release 并挂附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          NOTES="RELEASE_NOTES-${TAG}.md"
          [ -f "$NOTES" ] || NOTES="RELEASE_NOTES.md"
          ZIP=$(find dist -type f -name 'drt-fitting-protocol.zip' | head -1)
          [ -n "$ZIP" ] || { echo "::error::未找到产物"; exit 1; }
          echo "tag=$TAG  说明=$NOTES  附件=$ZIP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "DRT 拟合规范 ${TAG}" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "DRT 拟合规范 ${TAG}" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" "$ZIP" --clobber
          # --clobber 只覆盖同名附件，这里清掉改名后残留的旧附件
          want=$(basename "$ZIP")
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            if [ -n "$name" ] && [ "$name" != "$want" ]; then
              echo "删除过期附件: $name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done
          gh release view "$TAG" --json tagName,name,assets
